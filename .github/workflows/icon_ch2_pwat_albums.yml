name: PWAT

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

jobs:
  plot_pwat:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare il push del lock sul repository
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: System Dependencies (ecCodes)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-tools libeccodes-dev
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
          
      - name: Setup MeteoSwiss Env
        run: |
          git clone https://github.com/MeteoSwiss/opendata-nwp-demos.git
          cd opendata-nwp-demos
          pip install poetry 
          poetry config virtualenvs.create false 
          poetry install --no-ansi
          
      - name: Esegui Script PWAT
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Mappatura secret del Thread 12
          TELEGRAM_THREAD_ID_41: ${{ secrets.TELEGRAM_THREAD_ID_41 }}
        run: |
          cp icon_ch2_pwat_albums.py opendata-nwp-demos/
          cp -r shapefiles opendata-nwp-demos/ || echo "No shapefiles"
          
          # Carica "l'hash" (il lock) esistente se presente
          cp ultima_ora_icon_ch2_pwat.txt opendata-nwp-demos/ 2>/dev/null || true
          
          cd opendata-nwp-demos
          pip install pytz shapely
          python icon_ch2_pwat_albums.py
          
          # Una volta terminato, riporta l'hash modificato fuori dalla cartella
          cp ultima_ora_icon_ch2_pwat.txt ../

      - name: Salva Lock ("Hash") nel Repository 
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ultima_ora_icon_ch2_pwat.txt
          # Effettua il push solo se il file è cambiato. Il flag [skip ci] evita loop infiniti
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento lock file ICON-CH2 PWAT [skip ci]" && git push)
