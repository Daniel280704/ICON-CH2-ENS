name: Precipitazioni orarie

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

jobs:
  plot_map:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare il push del lock sul repository
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Dependencies (ecCodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools libeccodes-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Ecosistema MeteoSwiss (meteodata-lab)
        run: |
          git clone https://github.com/MeteoSwiss/opendata-nwp-demos.git
          cd opendata-nwp-demos
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-ansi

      - name: Esegui Python Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID_2: ${{ secrets.TELEGRAM_THREAD_ID_2 }}
        run: |
          # Copia script e cartella dal repo base all'interno della cartella temporanea
          cp icon_ch2_hourly_precipitations.py opendata-nwp-demos/
          cp -r shapefiles opendata-nwp-demos/ || echo "Attenzione: Cartella shapefiles non trovata"
          
          # Carica "l'hash" (il lock) esistente se presente
          cp ultima_ora_icon_ch2_stac.txt opendata-nwp-demos/ 2>/dev/null || true
          
          cd opendata-nwp-demos
          pip install pytz
          python icon_ch2_hourly_precipitations.py
          
          # Una volta terminato, riporta l'hash modificato fuori dalla cartella
          cp ultima_ora_icon_ch2_stac.txt ../

      - name: Salva Lock ("Hash") nel Repository 
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ultima_ora_icon_ch2_hourly_precipitations.txt
          # Fa il commit, scarica eventuali lock file pushati dagli altri script in parallelo e poi pusha
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento lock file ICON-CH2 WIND [skip ci]" && git pull --rebase origin main && git push)
