name: Updraft 700hPa

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  plot_map_w_700:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Dependencies (ecCodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools libeccodes-dev

      - name: Setup Ecosistema MeteoSwiss (meteodata-lab)
        run: |
          git clone https://github.com/MeteoSwiss/opendata-nwp-demos.git
          cd opendata-nwp-demos
          pipx install poetry
          poetry install --no-ansi

      - name: Esegui Python Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID_31: ${{ secrets.TELEGRAM_THREAD_ID_31 }}
        run: |
          cp icon_ch2_w_700.py opendata-nwp-demos/
          cp -r shapefiles opendata-nwp-demos/ || echo "Attenzione: Cartella shapefiles non trovata"
          
          cp ultima_ora_icon_ch2_w_700.txt opendata-nwp-demos/ 2>/dev/null || true
          
          cd opendata-nwp-demos
          poetry add pytz
          poetry run python icon_ch2_w_700.py
          
          # Aggiunto '2>/dev/null || true' per evitare l'errore se il file non esiste
          cp ultima_ora_icon_ch2_w_700.txt ../ 2>/dev/null || true
          
      - name: Salva Lock ("Hash") nel Repository 
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          LOCK_FILE="ultima_ora_icon_ch2_w_700.txt"
          
          if [ -f "$LOCK_FILE" ]; then
            git add "$LOCK_FILE"
          else
            echo "Il file $LOCK_FILE non esiste, ignoro l'add."
          fi
          
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento lock file ICON-CH2 W 700hPa [skip ci]"
            
            MAX_RETRIES=10
            RETRY_COUNT=0
            until git push; do
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "Impossibile fare il push dopo $MAX_RETRIES tentativi."
                exit 1
              fi
              echo "Conflitto rilevato. Ritento push ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep $((RANDOM % 15 + 5))
              git pull --rebase origin main
            done
          else
            echo "Nessuna modifica da salvare."
          fi
