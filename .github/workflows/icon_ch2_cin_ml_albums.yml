name: CIN_ML

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

jobs:
  plot_cin_ml:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: System Dependencies (ecCodes)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-tools libeccodes-dev
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
          
      - name: Setup MeteoSwiss Env
        run: |
          git clone https://github.com/MeteoSwiss/opendata-nwp-demos.git
          cd opendata-nwp-demos
          pip install poetry 
          poetry config virtualenvs.create false 
          poetry install --no-ansi
          
      - name: Esegui Script CIN_ML
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID_11: ${{ secrets.TELEGRAM_THREAD_ID_11 }}
        run: |
          cp icon_ch2_cin_ml_albums.py opendata-nwp-demos/
          cp -r shapefiles opendata-nwp-demos/ || echo "No shapefiles"
          
          cp ultima_ora_icon_ch2_cin_ml.txt opendata-nwp-demos/ 2>/dev/null || true
          
          cd opendata-nwp-demos
          pip install pytz shapely
          python icon_ch2_cin_ml_albums.py
          
          cp ultima_ora_icon_ch2_cin_ml.txt ../

      - name: Salva Lock ("Hash") nel Repository 
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          LOCK_FILE="ultima_ora_icon_ch2_cin_ml.txt"
          
          if [ -f "$LOCK_FILE" ]; then
            git add "$LOCK_FILE"
          else
            echo "Il file $LOCK_FILE non esiste, ignoro l'add."
          fi
          
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento lock file ICON-CH2 CIN_ML [skip ci]"
            
            MAX_RETRIES=10
            RETRY_COUNT=0
            until git push; do
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "Impossibile fare il push dopo $MAX_RETRIES tentativi."
                exit 1
              fi
              echo "Conflitto rilevato. Ritento push ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep $((RANDOM % 15 + 5))
              git pull --rebase origin main
            done
          else
            echo "Nessuna modifica da salvare."
          fi
